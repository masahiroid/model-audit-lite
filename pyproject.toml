[project]
name = "model-audit-lite"
version = "0.6.0"
description = "Lightweight safety audit for Hugging Face models: file-distribution audit, a conversion-integrity diff (chat_template + safety-probe regressions between a source and a converted repo), and a small known-pattern prompt-injection probe suite."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "masahiroid" }
]
dependencies = [
    "huggingface_hub>=0.20",
    "pyyaml>=6.0",
]

keywords = ["huggingface", "llm", "security", "audit", "prompt-injection", "sbom", "ml-bom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/masahiroid/model-audit-lite"
Issues = "https://github.com/masahiroid/model-audit-lite/issues"

[project.optional-dependencies]
mlx = ["mlx-lm"]
transformers = ["transformers", "torch"]

[project.scripts]
model-audit-lite = "model_audit_lite.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["model_audit_lite*"]

[tool.setuptools.package-data]
model_audit_lite = ["probes/*.yaml"]
